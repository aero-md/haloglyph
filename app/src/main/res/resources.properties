# Langue du dossier `values/` non qualifié — la langue de repli.
#
# AGP en a besoin pour générer le `localeConfig` : sans elle, il ne saurait pas
# quelle langue contient le dossier par défaut, et le sélecteur système
# afficherait les quatre traductions sans l'original.
#
# Ajouter une langue = poser un `values-xx/strings.xml`. AGP le voit et l'inscrit.
unqualifiedResLocale=en-US
